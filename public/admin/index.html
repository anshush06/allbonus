<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>AllBonus Admin</title>
    <!-- Config is generated at build time by src/pages/admin/config.json.ts -->
    <link href="config.json" type="application/json" rel="cms-config-url" />
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms@0.257.0/dist/sveltia-cms.js"></script>
    <script>
      // The login button opens our email + password page (functions/api/auth.ts),
      // but Sveltia labels it after the git host. Rename it.
      const FROM = 'Sign In with GitHub', TO = 'Sign In with Email';
      const rename = () => {
        const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
        // Sveltia wraps the host name in invisible bidi marks (U+2068/U+2069).
        for (let n; (n = walker.nextNode()); ) if (n.nodeValue.replace(/[\u2068\u2069]/g, '').trim() === FROM) n.nodeValue = TO;
      };
      new MutationObserver(rename).observe(document.body, { childList: true, subtree: true, characterData: true });
    </script>
  </body>
</html>
