# Builds the site and publishes it to Cloudflare Pages on every push to main
# (including saves made from the /admin/ panel).
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  PROJECT: allbonus

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Create Pages project on first run
        run: |
          if ! npx wrangler pages project list | grep -qw "$PROJECT"; then
            npx wrangler pages project create "$PROJECT" --production-branch main
          fi
      - name: Deploy
        run: npx wrangler pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true
